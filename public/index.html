<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scalable Web App</title>
  <!-- CDN: Bootstrap CSS nearest server se load hota hai, latency kam hoti hai -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container py-4">
  <h1>Scalable Web App Demo</h1>
  <p>Load balancing, caching, DB optimization, CDN and monitoring.</p>
  <button id="load" class="btn btn-primary">Load Products</button>
  <p id="info" class="mt-3"></p>
  <ul id="list" class="list-group mt-2"></ul>

  <script>
    document.getElementById('load').addEventListener('click', async () => {
      const res = await fetch('/api/products');
      const json = await res.json();
      document.getElementById('info').textContent =
        `Served by worker ${json.servedBy} in ${json.timeMs} ms`;
      document.getElementById('list').innerHTML = json.data
        .slice(0, 10)
        .map((p) => `<li class="list-group-item">${p.name} - ₹${p.price}</li>`)
        .join('');
    });
  </script>
</body>
</html>
